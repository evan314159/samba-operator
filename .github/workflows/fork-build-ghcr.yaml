name: Fork Build to GHCR

# Builds the operator image from this fork and pushes it to GHCR so a
# patched build can be deployed to a test cluster. Not for upstream.

on:
  workflow_dispatch: {}
  push:
    branches:
      - custom-config-removals-ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # An immutable tag, so that GitOps sees a change on every rebuild.
      - name: Compute image tag
        id: tag
        run: echo "tag=config-removals-${GITHUB_SHA::10}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN could not create packages from the cilium fork, so a PAT
      # with write:packages is stored as the GHCR_TOKEN secret.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Only the arch of the cluster, to keep build times down.
          platforms: linux/amd64
          build-args: |
            GIT_VERSION=${{ steps.tag.outputs.tag }}
            COMMIT_ID=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/samba-operator:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
